<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D-GIS GCP & オルソエクスポート</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
        
        #header-controls {
            padding: 10px;
            background: #2c3e50;
            color: white;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 1000;
        }
        
        button {
            padding: 6px 12px;
            font-size: 13px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover { background-color: #2980b9; }
        
        .export-btn { background-color: #e67e22; }
        .export-btn:hover { background-color: #d35400; }

        #main-container {
            display: flex;
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 50px);
        }

        /* 左側：3Dビュー */
        #pane-3d { width: 50%; height: 100%; position: relative; border-right: 2px solid #ccc; }
        #canvas-container { width: 100%; height: 100%; display: block; }
        
        /* 右側：2D地図 */
        #pane-map { width: 50%; height: 100%; position: relative; }

        /* GCP管理パネル */
        #gcp-panel {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            max-width: 90%;
            max-height: 40%;
            overflow-y: auto;
            color: #333;
        }
        
        table { border-collapse: collapse; width: 100%; font-size: 12px; }
        th, td { border: 1px solid #ccc; padding: 4px; text-align: center; }
        input[type="text"] { width: 90px; font-size: 11px; padding: 2px; }

        .crosshair-instruction {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>

    <!-- Three.js (ES Modules) -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

<div id="header-controls">
    <div style="font-weight: bold;">3D-GIS アライメントツール</div>
    <button onclick="document.getElementById('file-input').click()">GLBファイルを選択して読み込む</button>
    <!-- ユーザーがファイルを選択するためのインプット要素（非表示） -->
    <input type="file" id="file-input" accept=".glb" style="display: none;">
    
    <div style="margin-left: auto; display: flex; gap: 10px;">
        <button class="export-btn" id="btn-export-exif">林小班図用エクスポート (JPG+Exif)</button>
        <button class="export-btn" id="btn-export-world">GIS用エクスポート (JPG+JGW)</button>
    </div>
</div>

<div id="main-container">
    <div id="pane-3d">
        <div class="crosshair-instruction">3DモデルをダブルクリックでGCPを追加</div>
        <div id="canvas-container"></div>
        
        <div id="gcp-panel">
            <div style="font-weight: bold; margin-bottom: 5px;">GCPリスト (最低3点必要)</div>
            <table id="gcp-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>3D X</th>
                        <th>3D Z</th>
                        <th>緯度 (Lat)</th>
                        <th>経度 (Lon)</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    
    <div id="pane-map">
        <div id="map" style="width: 100%; height: 100%;"></div>
    </div>
</div>

<!-- Leaflet & piexifjs -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/piexifjs@1.0.6/piexif.js"></script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ==========================================
    // 2D マップ (Leaflet) セットアップ
    // ==========================================
    const map = L.map('map').setView([36.065, 136.221], 16);
    
    const photo = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
        attribution: '地理院タイル (写真)', maxZoom: 18
    });
    const std = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
        attribution: '地理院タイル (標準)', maxZoom: 18
    });
    
    photo.addTo(map);
    L.control.layers({"空中写真": photo, "標準地図": std}).addTo(map);

    let mapClickMarker = null;
    let selectedGcpId = null;

    map.on('click', function(e) {
        if (selectedGcpId !== null) {
            const latInput = document.getElementById(`lat-${selectedGcpId}`);
            const lonInput = document.getElementById(`lon-${selectedGcpId}`);
            if(latInput && lonInput) {
                latInput.value = e.latlng.lat.toFixed(6);
                lonInput.value = e.latlng.lng.toFixed(6);
                updateGcpData(selectedGcpId);
            }
            if(mapClickMarker) map.removeLayer(mapClickMarker);
            mapClickMarker = L.marker(e.latlng).addTo(map);
        }
    });

    // ==========================================
    // 3D ビュー (Three.js) セットアップ
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 10, 10);

    const orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
    directionalLight.position.set(10, 10, 5);
    scene.add(directionalLight);

    let currentModel = null;
    let modelBox = new THREE.Box3();
    const loader = new GLTFLoader();

    // ★ ユーザーのファイル選択イベントのみでモデルをロードするように変更
    document.getElementById('file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        // ローカルファイルをブラウザ内で利用可能なURLに変換
        const url = URL.createObjectURL(file);
        
        loader.load(url, function(gltf) {
            setupModel(gltf.scene);
        });
    });

    function setupModel(model) {
        if (currentModel) scene.remove(currentModel);
        currentModel = model;
        scene.add(currentModel);
        
        modelBox.setFromObject(currentModel);
        const center = modelBox.getCenter(new THREE.Vector3());
        currentModel.position.sub(center);
        
        modelBox.setFromObject(currentModel);
        const size = modelBox.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        camera.position.set(0, maxDim, maxDim);
        controls.target.set(0, 0, 0);
    }

    // ==========================================
    // GCP 配置ロジック (Raycaster)
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let gcps = [];
    let gcpCounter = 1;

    container.addEventListener('dblclick', function(e) {
        if (!currentModel) return;
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(currentModel, true);

        if (intersects.length > 0) {
            const point = intersects[0].point;
            addGcpPoint(point);
        }
    });

    function addGcpPoint(point) {
        const geometry = new THREE.SphereGeometry(modelBox.getSize(new THREE.Vector3()).x * 0.01, 16, 16);
        const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const sphere = new THREE.Mesh(geometry, material);
        sphere.position.copy(point);
        scene.add(sphere);

        const gcp = {
            id: gcpCounter++,
            mesh: sphere,
            local: point,
            lat: "",
            lon: ""
        };
        gcps.push(gcp);
        renderGcpTable();
    }

    window.selectGcp = function(id) {
        selectedGcpId = id;
        document.querySelectorAll('#gcp-table tbody tr').forEach(tr => tr.style.backgroundColor = '');
        document.getElementById(`row-${id}`).style.backgroundColor = '#e8f4f8';
    };

    window.updateGcpData = function(id) {
        const gcp = gcps.find(g => g.id === id);
        if (gcp) {
            gcp.lat = parseFloat(document.getElementById(`lat-${id}`).value) || "";
            gcp.lon = parseFloat(document.getElementById(`lon-${id}`).value) || "";
        }
    };

    function renderGcpTable() {
        const tbody = document.querySelector('#gcp-table tbody');
        tbody.innerHTML = '';
        gcps.forEach(gcp => {
            const tr = document.createElement('tr');
            tr.id = `row-${gcp.id}`;
            tr.onclick = () => window.selectGcp(gcp.id);
            tr.innerHTML = `
                <td>${gcp.id}</td>
                <td>${gcp.local.x.toFixed(2)}</td>
                <td>${gcp.local.z.toFixed(2)}</td>
                <td><input type="text" id="lat-${gcp.id}" value="${gcp.lat}" onchange="updateGcpData(${gcp.id})"></td>
                <td><input type="text" id="lon-${gcp.id}" value="${gcp.lon}" onchange="updateGcpData(${gcp.id})"></td>
                <td><button onclick="removeGcp(${gcp.id})" style="padding:2px 6px; background:#e74c3c;">消</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.removeGcp = function(id) {
        const index = gcps.findIndex(g => g.id === id);
        if(index > -1) {
            scene.remove(gcps[index].mesh);
            gcps.splice(index, 1);
            if(selectedGcpId === id) selectedGcpId = null;
            renderGcpTable();
        }
    };

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // ==========================================
    // アフィン変換 (2D: XZ -> LonLat)
    // ==========================================
    function calculateAffineTransform() {
        const validGcps = gcps.filter(g => g.lat !== "" && g.lon !== "");
        if (validGcps.length < 3) {
            alert("最低3つのGCPに緯度経度を入力してください。");
            return null;
        }

        const [p1, p2, p3] = validGcps;
        const det = p1.local.x * (p2.local.z - p3.local.z) - p1.local.z * (p2.local.x - p3.local.x) + (p2.local.x * p3.local.z - p3.local.x * p2.local.z);
        
        if (Math.abs(det) < 1e-10) {
            alert("GCPが一直線上に並んでいるため変換できません。配置を分散させてください。");
            return null;
        }

        const a = (p1.lon * (p2.local.z - p3.local.z) - p1.local.z * (p2.lon - p3.lon) + (p2.lon * p3.local.z - p3.lon * p2.local.z)) / det;
        const b = (p1.local.x * (p2.lon - p3.lon) - p1.lon * (p2.local.x - p3.local.x) + (p2.local.x * p3.lon - p3.local.x * p2.lon)) / det;
        const c = p1.lon - a * p1.local.x - b * p1.local.z;

        const d = (p1.lat * (p2.local.z - p3.local.z) - p1.local.z * (p2.lat - p3.lat) + (p2.lat * p3.local.z - p3.lat * p2.local.z)) / det;
        const e = (p1.local.x * (p2.lat - p3.lat) - p1.lat * (p2.local.x - p3.local.x) + (p2.local.x * p3.lat - p3.local.x * p2.lat)) / det;
        const f = p1.lat - d * p1.local.x - e * p1.local.z;

        return { a, b, c, d, e, f };
    }

    function localToGeo(transform, localX, localZ) {
        const lon = transform.a * localX + transform.b * localZ + transform.c;
        const lat = transform.d * localX + transform.e * localZ + transform.f;
        return { lat, lon };
    }

    // ==========================================
    // エクスポート処理
    // ==========================================
    function captureOrthoImage(transform) {
        if (!currentModel) return null;
        
        modelBox.setFromObject(currentModel);
        const center = modelBox.getCenter(new THREE.Vector3());
        const size = modelBox.getSize(new THREE.Vector3());

        orthoCamera.position.set(center.x, modelBox.max.y + 10, center.z);
        orthoCamera.lookAt(center.x, center.y, center.z);

        const halfWidth = size.x / 2;
        const halfHeight = size.z / 2;
        
        orthoCamera.left = -halfWidth * 1.1;
        orthoCamera.right = halfWidth * 1.1;
        orthoCamera.top = halfHeight * 1.1;
        orthoCamera.bottom = -halfHeight * 1.1;
        orthoCamera.updateProjectionMatrix();

        gcps.forEach(g => g.mesh.visible = false);
        renderer.render(scene, orthoCamera);
        const dataUrl = renderer.domElement.toDataURL('image/jpeg', 0.95);
        gcps.forEach(g => g.mesh.visible = true);

        const viewMinX = center.x + orthoCamera.left;
        const viewMaxX = center.x + orthoCamera.right;
        const viewMinZ = center.z - orthoCamera.top;
        const viewMaxZ = center.z - orthoCamera.bottom;

        const tl = localToGeo(transform, viewMinX, viewMinZ);
        const br = localToGeo(transform, viewMaxX, viewMaxZ);

        const south = Math.min(tl.lat, br.lat).toFixed(6);
        const north = Math.max(tl.lat, br.lat).toFixed(6);
        const west = Math.min(tl.lon, br.lon).toFixed(6);
        const east = Math.max(tl.lon, br.lon).toFixed(6);

        return { dataUrl, bounds: `${south},${west},${north},${east}`, tl, br, sizeX: (viewMaxX - viewMinX), sizeZ: (viewMaxZ - viewMinZ) };
    }

    document.getElementById('btn-export-exif').addEventListener('click', () => {
        const transform = calculateAffineTransform();
        if (!transform) return;

        const capture = captureOrthoImage(transform);
        if(!capture) return;

        try {
            const zeroth = {};
            const exif = {};
            const gps = {};
            zeroth[piexif.ImageIFD.ImageDescription] = capture.bounds;
            
            const exifObj = {"0th": zeroth, "Exif": exif, "GPS": gps};
            const exifBytes = piexif.dump(exifObj);
            const newDataUrl = piexif.insert(exifBytes, capture.dataUrl);

            const link = document.createElement('a');
            link.download = `3d_ortho_${capture.bounds}.jpg`;
            link.href = newDataUrl;
            link.click();
        } catch (e) {
            alert("Exifの書き込みに失敗しました: " + e.toString());
        }
    });

    document.getElementById('btn-export-world').addEventListener('click', () => {
        const transform = calculateAffineTransform();
        if (!transform) return;

        const capture = captureOrthoImage(transform);
        if(!capture) return;

        const imgLink = document.createElement('a');
        imgLink.download = "3d_ortho.jpg";
        imgLink.href = capture.dataUrl;
        imgLink.click();

        const canvas = renderer.domElement;
        const pixelWidthDeg = (Math.max(capture.tl.lon, capture.br.lon) - Math.min(capture.tl.lon, capture.br.lon)) / canvas.width;
        const pixelHeightDeg = (Math.min(capture.tl.lat, capture.br.lat) - Math.max(capture.tl.lat, capture.br.lat)) / canvas.height;

        const jgwContent = `${pixelWidthDeg}\n0.0000000000\n0.0000000000\n${pixelHeightDeg}\n${Math.min(capture.tl.lon, capture.br.lon)}\n${Math.max(capture.tl.lat, capture.br.lat)}\n`;

        const blob = new Blob([jgwContent], { type: 'text/plain' });
        const jgwLink = document.createElement('a');
        jgwLink.download = "3d_ortho.jgw";
        jgwLink.href = URL.createObjectURL(blob);
        jgwLink.click();
    });
</script>
</body>
</html>
